<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>拍品查询</title>

<!-- ホーム画面に追加した際、Safari の UI を消して全画面アプリのように表示する設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="拍品查询">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#b8862b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">

<style>
  :root {
    --accent: #b8862b;
    --accent-dark: #8a641f;
    --bg: #f7f5f1;
    --card-bg: #ffffff;
    --text: #222;
    --muted: #888;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { overscroll-behavior-y: none; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: calc(18px + env(safe-area-inset-top)) 16px 22px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { margin: 0; font-size: 22px; letter-spacing: 2px; font-weight: 700; }
  header .sub { font-size: 12px; opacity: 0.9; margin-top: 4px; }

  .search-wrap {
    max-width: 560px;
    margin: -18px auto 0;
    padding: 0 16px;
    position: relative;
    z-index: 5;
  }
  .search-box {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    padding: 12px 14px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .search-box input {
    flex: 1; border: none; outline: none; font-size: 19px;
    padding: 10px 8px; background: transparent; min-width: 0;
  }
  .search-box .clear-btn {
    border: none; background: #eee; color: #666; font-size: 15px;
    padding: 10px 14px; border-radius: 12px; display: none;
  }
  .refresh-btn {
    border: none; background: #eee; color: #666; font-size: 16px;
    padding: 10px 12px; border-radius: 12px; white-space: nowrap;
  }

  .breadcrumb {
    max-width: 560px; margin: 14px auto 4px; padding: 0 16px;
    display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted);
  }
  .breadcrumb .back-btn, .breadcrumb .home-btn {
    border: none; background: #fff; color: var(--accent-dark); font-weight: 700;
    font-size: 16px; padding: 11px 16px; border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08); white-space: nowrap;
  }
  .breadcrumb .back-btn:active, .breadcrumb .home-btn:active { background: #f2ede3; }
  .breadcrumb .crumb-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }

  .status { max-width: 560px; margin: 14px auto; padding: 0 16px; color: var(--muted); font-size: 15px; text-align: center; }
  .status.error { color: #c0392b; }

  .view { max-width: 560px; margin: 0 auto; padding: 12px 16px; }
  .view.hidden { display: none; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .grid-tile {
    background: var(--card-bg); border-radius: 18px; box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10px; text-align: center;
  }
  .grid-tile:active { background: #f5efe0; transform: scale(0.97); }
  .grid-tile .tile-icon { font-size: 32px; margin-bottom: 6px; }
  .grid-tile .tile-name { font-size: 22px; font-weight: 800; color: var(--accent-dark); word-break: break-all; line-height: 1.25; }
  .grid-tile .tile-count { font-size: 14px; color: var(--muted); margin-top: 5px; }

  .lot-list-item {
    background: var(--card-bg); border-radius: 16px; box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    margin-bottom: 12px; padding: 16px 16px; display: flex; gap: 12px; align-items: center;
  }
  .lot-list-item:active { background: #faf7f0; }
  .lot-info { flex: 1; min-width: 0; }
  .lot-info .lot-no { font-size: 19px; font-weight: 800; color: var(--text); }
  .lot-info .lot-title { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 3px; }
  .lot-arrow { color: #ccc; font-size: 22px; }

  .card { background: var(--card-bg); border-radius: 16px; box-shadow: 0 3px 10px rgba(0,0,0,0.08); margin-bottom: 16px; overflow: hidden; }
  .card-top { padding: 24px 18px 16px; text-align: center; background: linear-gradient(180deg, #fffaf0, #ffffff); }
  .auction-label { font-size: 14px; color: var(--accent-dark); letter-spacing: 4px; margin-bottom: 4px; font-weight: 600; }
  .auction-no {
    font-size: 72px; font-weight: 800; color: var(--accent-dark); line-height: 1.1; word-break: break-all;
    cursor: pointer; display: inline-block; padding: 6px 14px; border-radius: 12px; transition: background 0.15s;
  }
  .auction-no:active { background: rgba(184, 134, 43, 0.15); transform: scale(0.98); }
  .copy-hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .lot-no-row { margin-top: 12px; font-size: 24px; font-weight: 700; color: var(--text); }
  .lot-no-row .lbl { font-size: 14px; color: var(--muted); font-weight: 400; margin-right: 5px; }
  .card-body { padding: 16px 20px 22px; font-size: 17px; line-height: 1.7; }
  .card-body .row { margin-bottom: 8px; }
  .card-body .row .lbl { color: var(--muted); font-size: 14px; margin-right: 6px; }

  .empty-hint { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 15px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(36px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(10px);
    background: rgba(30, 28, 24, 0.92); color: #fff; padding: 10px 20px; border-radius: 999px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
    z-index: 100; white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>拍 品 查 询</h1>
  <div class="sub" id="dataInfo">数据加载中...</div>
</header>

<div class="search-wrap">
  <div class="search-box">
    <input id="q" type="text" inputmode="search" placeholder="输入编号 / 名称 / 作者搜索">
    <button class="clear-btn" id="clearBtn" onclick="clearSearch()">清空</button>
    <button class="refresh-btn" onclick="manualRefresh()">🔄</button>
  </div>
</div>

<div class="breadcrumb hidden" id="breadcrumb">
  <button class="back-btn" onclick="goBack()">‹ 返回</button>
  <div class="crumb-text" id="crumbText"></div>
  <button class="home-btn" onclick="goHome()">🏠 主页</button>
</div>

<div class="status" id="status"></div>

<div class="view" id="view-groups"><div class="grid" id="groupsGrid"></div></div>
<div class="view hidden" id="view-list"><div id="lotList"></div></div>
<div class="view hidden" id="view-detail"><div id="detailCard"></div></div>
<div class="view hidden" id="view-search"><div id="searchResults"></div></div>

<div class="toast" id="toast"></div>

<script>
// ============== 配置区：请根据你的 Google Sheet 修改下面两行 ==============
// 1. SPREADSHEET_ID: 从 Google Sheet 网址中取出，例如：
//    https://docs.google.com/spreadsheets/d/【这一长串就是ID】/edit?usp=sharing
const SPREADSHEET_ID = '1Z5kHRR3kX6Nl5iqZZUf-u-kBKk79BINzTHqz2GZZrp0';

// 2. SHEET_NAME: 数据所在的"工作表标签名"（Google Sheet 底部的标签，比如 Sheet1、Sheet2、拍卖数据 等）
//    请打开你的 Google Sheet，看数据实际在哪个标签页里，把名字填在这里
const SHEET_NAME = 'Sheet2';

// 表头列名（需与 Google Sheet 表头文字一致，如不一致请修改）
const COL_AUCTION_NO = '拍卖号';
const COL_LOT_NO = '拍品编号';
const COL_AUTHOR = '拍品作者';
const COL_TITLE = '拍品名称';
const COL_MATERIAL = '质地/款识';
const COL_DESC = '说明';
// ==========================================================================

function buildCsvUrl() {
  return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}&_=${Date.now()}`;
}

// ---- 简易 CSV 解析（支持带引号、逗号、换行的字段） ----
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v !== ''));
}

let allItems = [];
let lastLoadedAt = null;

async function loadData(force) {
  setStatus('数据加载中...');
  try {
    const res = await fetch(buildCsvUrl(), { cache: force ? 'no-store' : 'default' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    if (rows.length < 2) throw new Error('表格里没有数据，请检查 SHEET_NAME 是否正确');

    const header = rows[0].map(h => h.trim());
    const idx = {
      auction: header.indexOf(COL_AUCTION_NO),
      lot: header.indexOf(COL_LOT_NO),
      author: header.indexOf(COL_AUTHOR),
      title: header.indexOf(COL_TITLE),
      material: header.indexOf(COL_MATERIAL),
      desc: header.indexOf(COL_DESC),
    };
    const missing = Object.entries(idx).filter(([k, v]) => v === -1).map(([k]) => k);
    if (missing.length) {
      throw new Error('表头缺少以下列，请检查 Google Sheet 表头文字：' + missing.join(', '));
    }

    allItems = rows.slice(1).map(r => ({
      auction_no: (r[idx.auction] || '').trim(),
      lot_no: (r[idx.lot] || '').trim(),
      author: (r[idx.author] || '').trim(),
      title: (r[idx.title] || '').trim(),
      material: (r[idx.material] || '').trim(),
      desc: (r[idx.desc] || '').trim(),
    })).filter(it => it.lot_no);

    lastLoadedAt = new Date();
    document.getElementById('dataInfo').textContent =
      `共 ${allItems.length} 件拍品 · 更新于 ${lastLoadedAt.toLocaleTimeString('zh-CN')}`;
    setStatus('');
    return true;
  } catch (e) {
    setStatus('数据加载失败：' + e.message + '（请检查网络连接、Google Sheet 是否已设为"知道链接的任何人可查看"）', true);
    document.getElementById('dataInfo').textContent = '加载失败';
    return false;
  }
}

function manualRefresh() {
  loadData(true).then(ok => { if (ok) renderCurrent(navStack[navStack.length - 1]); });
}

// ============== 状态管理 ==============
let navStack = [{ view: 'groups' }];
let currentGroupItems = [];

const els = {
  status: document.getElementById('status'),
  breadcrumb: document.getElementById('breadcrumb'),
  crumbText: document.getElementById('crumbText'),
  viewGroups: document.getElementById('view-groups'),
  viewList: document.getElementById('view-list'),
  viewDetail: document.getElementById('view-detail'),
  viewSearch: document.getElementById('view-search'),
  groupsGrid: document.getElementById('groupsGrid'),
  lotList: document.getElementById('lotList'),
  detailCard: document.getElementById('detailCard'),
  searchResults: document.getElementById('searchResults'),
  q: document.getElementById('q'),
  clearBtn: document.getElementById('clearBtn'),
};

function esc(s) {
  if (s === undefined || s === null) return '';
  return String(s).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
}
function escForJsAttr(s) {
  let v = String(s === undefined || s === null ? '' : s);
  v = v.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  v = v.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return v;
}

function setStatus(text, isError) {
  els.status.textContent = text || '';
  els.status.className = 'status' + (isError ? ' error' : '');
}

function showView(name) {
  els.viewGroups.classList.toggle('hidden', name !== 'groups');
  els.viewList.classList.toggle('hidden', name !== 'list');
  els.viewDetail.classList.toggle('hidden', name !== 'detail');
  els.viewSearch.classList.toggle('hidden', name !== 'search');
}

function getGroup(lotNo) {
  lotNo = (lotNo || '').trim();
  if (lotNo.includes('-')) return lotNo.split('-')[0].trim();
  return lotNo;
}

function renderGroups() {
  const groups = {};
  allItems.forEach(it => {
    const g = getGroup(it.lot_no);
    groups[g] = (groups[g] || 0) + 1;
  });
  const list = Object.entries(groups).sort((a, b) => a[0].localeCompare(b[0]));
  if (!list.length) {
    els.groupsGrid.innerHTML = '<div class="empty-hint">暂无数据</div>';
    return;
  }
  els.groupsGrid.innerHTML = list.map(([g, count]) => `
    <div class="grid-tile" onclick="openGroup('${escForJsAttr(g)}')">
      <div class="tile-icon">📦</div>
      <div class="tile-name">${esc(g)}</div>
      <div class="tile-count">${count} 件</div>
    </div>
  `).join('');
}

function renderBreadcrumb() {
  if (navStack.length <= 1) { els.breadcrumb.classList.add('hidden'); return; }
  els.breadcrumb.classList.remove('hidden');
  const top = navStack[navStack.length - 1];
  if (top.view === 'list') els.crumbText.textContent = `库号：${top.group}`;
  else if (top.view === 'detail') els.crumbText.textContent = `编号：${top.item.lot_no}`;
  else els.crumbText.textContent = '';
}

function goBack() {
  if (navStack.length <= 1) return;
  navStack.pop();
  renderCurrent(navStack[navStack.length - 1]);
}
function goHome() {
  navStack = [{ view: 'groups' }];
  els.q.value = '';
  els.clearBtn.style.display = 'none';
  renderCurrent(navStack[0]);
}

function renderCurrent(state) {
  renderBreadcrumb();
  if (state.view === 'groups') { showView('groups'); renderGroups(); setStatus(''); }
  else if (state.view === 'list') { showView('list'); renderLotList(state.items); setStatus(''); }
  else if (state.view === 'detail') { showView('detail'); renderDetail(state.item); setStatus(''); }
}

function openGroup(group) {
  const items = allItems.filter(it => getGroup(it.lot_no) === group)
    .sort((a, b) => a.lot_no.localeCompare(b.lot_no));
  currentGroupItems = items;
  const state = { view: 'list', group, items };
  navStack.push(state);
  renderCurrent(state);
}

function renderLotList(items) {
  if (!items.length) {
    els.lotList.innerHTML = '<div class="empty-hint">该库号下暂无拍品</div>';
    return;
  }
  els.lotList.innerHTML = items.map((item, idx) => `
    <div class="lot-list-item" onclick="openDetailFromList(${idx})">
      <div class="lot-info">
        <div class="lot-no">${esc(item.lot_no)}</div>
        <div class="lot-title">${esc(item.title) || esc(item.author) || ''}</div>
      </div>
      <div class="lot-arrow">›</div>
    </div>
  `).join('');
}

function openDetailFromList(idx) {
  const item = currentGroupItems[idx];
  const state = { view: 'detail', item };
  navStack.push(state);
  renderCurrent(state);
}

function detailCardHtml(item) {
  const auctionNoRaw = item.auction_no || '';
  const auctionNoAttr = escForJsAttr(auctionNoRaw);
  return `
    <div class="card">
      <div class="card-top">
        <div class="auction-label">拍 卖 号</div>
        <div class="auction-no" onclick="copyText('${auctionNoAttr}')">${esc(auctionNoRaw) || '—'}</div>
        <div class="copy-hint">轻触拍卖号即可复制</div>
        <div class="lot-no-row"><span class="lbl">编号</span>${esc(item.lot_no) || '—'}</div>
      </div>
      <div class="card-body">
        ${item.author ? `<div class="row"><span class="lbl">作者</span>${esc(item.author)}</div>` : ''}
        ${item.title ? `<div class="row"><span class="lbl">名称</span>${esc(item.title)}</div>` : ''}
        ${item.material ? `<div class="row"><span class="lbl">质地/款识</span>${esc(item.material)}</div>` : ''}
        ${item.desc ? `<div class="row"><span class="lbl">说明</span>${esc(item.desc)}</div>` : ''}
      </div>
    </div>
  `;
}
function renderDetail(item) { els.detailCard.innerHTML = detailCardHtml(item); }

// ============== 复制到剪贴板 ==============
let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1500);
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}
function copyText(text) {
  if (!text) return;
  const done = () => showToast(`已复制：${text}`);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => { fallbackCopy(text); done(); });
  } else {
    fallbackCopy(text); done();
  }
}

// ============== 搜索 ==============
let searchTimer = null;
els.q.addEventListener('input', () => {
  els.clearBtn.style.display = els.q.value.trim() ? 'block' : 'none';
  clearTimeout(searchTimer);
  searchTimer = setTimeout(doSearch, 250);
});
els.q.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

function clearSearch() {
  els.q.value = '';
  els.clearBtn.style.display = 'none';
  renderCurrent(navStack[navStack.length - 1]);
}

function doSearch() {
  const q = els.q.value.trim().toLowerCase();
  if (!q) { renderCurrent(navStack[navStack.length - 1]); return; }
  els.breadcrumb.classList.add('hidden');
  showView('search');

  const exact = allItems.filter(it => it.lot_no.toLowerCase() === q);
  let list = exact.length ? exact : allItems.filter(it =>
    it.lot_no.toLowerCase().includes(q) ||
    it.auction_no.toLowerCase().includes(q) ||
    it.title.toLowerCase().includes(q) ||
    it.author.toLowerCase().includes(q)
  );
  list = list.slice(0, 50);

  if (!list.length) {
    setStatus('');
    els.searchResults.innerHTML = '<div class="empty-hint">没有找到匹配的拍品</div>';
    return;
  }
  setStatus(`找到 ${list.length} 条结果`);
  els.searchResults.innerHTML = list.map(detailCardHtml).join('');
}

// ============== 初始化 ==============
loadData().then(() => renderCurrent(navStack[0]));
</script>

</body>
</html>
